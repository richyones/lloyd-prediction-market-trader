name: Lloyd Health Check

on:
  schedule:
    # Runs every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: "0 */6 * * *"
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install httpx

      - name: Run health check
        env:
          LLOYD_BASE_URL: ${{ secrets.LLOYD_BASE_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLOYD_ENVIRONMENT: "production"
          MAX_COST_PER_CYCLE_USD: "2.0"
          PIPELINE_STUCK_HOURS: "4"
          SCAN_DEAD_HOURS: "6"
          RESOLVER_LOOKBACK_DAYS: "3"
          RESOLVER_HIGH_COUNT: "5"
          CYCLE_COST_HIGH_USD: "3.0"
          CYCLE_COST_CRITICAL_USD: "5.0"
          DAILY_COST_HIGH_USD: "20.0"
          DAILY_COST_CRITICAL_USD: "35.0"
          DAILY_COST_WARN_MULTIPLIER: "1.25"
          DAILY_COST_HIGH_MULTIPLIER: "1.5"
          DAILY_COST_CRITICAL_MULTIPLIER: "2.0"
          API_DATA_FETCH_ATTEMPTS: "2"
          API_DATA_RETRY_BACKOFF_SECONDS: "2.0"
        run: python lloyd_healthcheck.py
